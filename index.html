<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#eef6ff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="BBI Flow" />
  <meta name="description" content="Pelacak pemasukan, checkout, profit, target, dan prediksi paket BBI." />
  <title>BBI Flow — Smart Cash Tracker</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f8ff;
      --surface: rgba(255, 255, 255, 0.88);
      --surface-solid: #ffffff;
      --surface-raised: #f9fbff;
      --surface-muted: #eaf2ff;
      --text: #1d1d1f;
      --text-soft: #55555b;
      --text-muted: #73737a;
      --border: rgba(29, 29, 31, 0.12);
      --border-strong: rgba(29, 29, 31, 0.2);
      --accent: #007aff;
      --accent-strong: #005ecb;
      --accent-soft: rgba(0, 122, 255, 0.12);
      --green: #248a3d;
      --green-soft: rgba(36, 138, 61, 0.13);
      --red: #d70015;
      --red-soft: rgba(215, 0, 21, 0.11);
      --amber: #b26a00;
      --amber-soft: rgba(178, 106, 0, 0.14);
      --shadow: 0 22px 60px rgba(0, 74, 173, 0.14);
      --shadow-soft: 0 12px 30px rgba(0, 74, 173, 0.08);
      --radius-card: 18px;
      --radius-control: 14px;
      --radius-pill: 999px;
      --sidebar-width: 256px;
      --nav-notch-bg: #eaf4ff;
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --bg: #070b12;
      --surface: rgba(28, 28, 30, 0.78);
      --surface-solid: #1c1c1e;
      --surface-raised: #242426;
      --surface-muted: #162235;
      --text: #f5f5f7;
      --text-soft: #c7c7cc;
      --text-muted: #9b9ba1;
      --border: rgba(255, 255, 255, 0.14);
      --border-strong: rgba(255, 255, 255, 0.22);
      --accent: #0a84ff;
      --accent-strong: #409cff;
      --accent-soft: rgba(10, 132, 255, 0.18);
      --green: #30d158;
      --green-soft: rgba(48, 209, 88, 0.16);
      --red: #ff453a;
      --red-soft: rgba(255, 69, 58, 0.16);
      --amber: #ffd60a;
      --amber-soft: rgba(255, 214, 10, 0.16);
      --shadow: 0 24px 68px rgba(0, 0, 0, 0.5);
      --shadow-soft: 0 14px 36px rgba(0, 0, 0, 0.34);
      --nav-notch-bg: #070b12;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      max-width: 100%;
    }

    body {
      background:
        linear-gradient(180deg, rgba(226, 241, 255, 0.92) 0%, rgba(255, 255, 255, 0.92) 42%, rgba(244, 248, 255, 1) 100%),
        var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", sans-serif;
      letter-spacing: 0;
      overflow-x: hidden;
      transition: background 180ms ease, color 180ms ease;
    }

    html[data-theme="dark"] body {
      background:
        linear-gradient(180deg, rgba(7, 20, 38, 0.96) 0%, rgba(7, 11, 18, 1) 48%, rgba(5, 7, 12, 1) 100%),
        var(--bg);
    }

    button,
    input,
    select {
      font: inherit;
      letter-spacing: 0;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    .icon-sprite {
      display: none;
    }

    .icon {
      display: inline-block;
      flex: 0 0 auto;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      vertical-align: middle;
    }

    .app-shell {
      min-height: 100vh;
    }

    .sidebar,
    .topbar,
    .bottom-nav,
    .panel,
    .metric-card,
    .tool-card,
    .history-card,
    .modal-panel,
    .toast {
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
    }

    .sidebar {
      display: none;
      position: fixed;
      inset: 0 auto 0 0;
      width: var(--sidebar-width);
      padding: 22px 14px;
      border-right: 1px solid var(--border);
      background: var(--surface);
      z-index: 30;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      padding: 6px 8px 20px;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: var(--radius-control);
      background: var(--accent-soft);
      color: var(--accent);
      box-shadow: var(--shadow-soft);
    }

    .brand-title {
      font-size: 1rem;
      font-weight: 760;
      line-height: 1.2;
    }

    .brand-subtitle {
      margin-top: 2px;
      color: var(--text-muted);
      font-size: 0.78rem;
      font-weight: 560;
    }

    .nav-stack {
      display: grid;
      gap: 6px;
    }

    .nav-btn,
    .bnav-btn,
    .tab-link,
    .theme-toggle,
    .btn,
    .icon-btn,
    .sort-btn,
    .toggle-btn,
    .q-btn {
      border: 0;
      cursor: pointer;
      transition: background 150ms ease, color 150ms ease, border-color 150ms ease, box-shadow 150ms ease, transform 100ms ease;
    }

    .nav-btn {
      min-height: 42px;
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      border-radius: var(--radius-control);
      padding: 0 12px;
      background: transparent;
      color: var(--text-soft);
      font-size: 0.92rem;
      font-weight: 650;
      text-align: left;
    }

    .nav-btn:hover,
    .nav-btn.active {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .sidebar-footer {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 16px;
      display: grid;
      gap: 10px;
    }

    .month-chip {
      min-height: 40px;
      display: flex;
      align-items: center;
      gap: 9px;
      border: 1px solid var(--border);
      border-radius: var(--radius-control);
      padding: 0 12px;
      color: var(--text-soft);
      background: var(--surface-raised);
      font-size: 0.84rem;
      font-weight: 650;
    }

    .theme-toggle {
      min-height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 1px solid var(--border);
      border-radius: var(--radius-control);
      background: var(--surface-solid);
      color: var(--text);
      font-weight: 700;
    }

    .theme-toggle:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--border);
      padding: 10px 14px;
      background: var(--surface);
      z-index: 40;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .topbar .brand-mark {
      width: 38px;
      height: 38px;
      box-shadow: none;
    }

    .topbar-title {
      display: grid;
      min-width: 0;
    }

    .topbar-title strong {
      overflow: hidden;
      color: var(--text);
      font-size: 0.95rem;
      font-weight: 760;
      line-height: 1.1;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .topbar-title span {
      overflow: hidden;
      color: var(--text-muted);
      font-size: 0.76rem;
      font-weight: 590;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tablet-links {
      display: none;
      gap: 6px;
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      padding: 4px;
      background: var(--surface-raised);
    }

    .tab-link {
      min-height: 34px;
      border-radius: var(--radius-pill);
      padding: 0 12px;
      background: transparent;
      color: var(--text-soft);
      font-size: 0.82rem;
      font-weight: 700;
    }

    .tab-link.active {
      background: var(--surface-solid);
      color: var(--accent);
      box-shadow: var(--shadow-soft);
    }

    .main {
      width: 100%;
      max-width: 1180px;
      margin: 0 auto;
      padding: 82px 14px 132px;
      overflow-x: hidden;
    }

    .view {
      display: none;
    }

    .view.active {
      display: block;
      animation: fadeIn 180ms ease both;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .page-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 16px;
    }

    .page-title {
      margin: 0;
      color: var(--text);
      font-size: 1.55rem;
      font-weight: 780;
      line-height: 1.1;
    }

    .page-subtitle {
      margin: 6px 0 0;
      color: var(--text-muted);
      font-size: 0.93rem;
      font-weight: 520;
      line-height: 1.45;
    }

    .btn {
      min-height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: var(--radius-control);
      padding: 0 14px;
      background: var(--accent);
      color: #ffffff;
      font-size: 0.9rem;
      font-weight: 720;
      text-decoration: none;
      white-space: nowrap;
    }

    .btn:hover {
      background: var(--accent-strong);
      box-shadow: 0 8px 22px rgba(0, 122, 255, 0.22);
    }

    .btn:active,
    .icon-btn:active,
    .q-btn:active,
    .nav-btn:active,
    .bnav-btn:active {
      transform: scale(0.97);
    }

    .btn.secondary {
      border: 1px solid var(--border);
      background: var(--surface-solid);
      color: var(--text);
      box-shadow: none;
    }

    .btn.secondary:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--surface-raised);
      box-shadow: none;
    }

    .btn.danger {
      background: var(--red);
    }

    .btn.warning {
      background: var(--amber);
      color: #111111;
    }

    .btn.full {
      width: 100%;
    }

    .icon-btn {
      min-width: 38px;
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border: 1px solid var(--border);
      border-radius: var(--radius-control);
      padding: 0 10px;
      background: var(--surface-solid);
      color: var(--text);
      font-size: 0.84rem;
      font-weight: 700;
    }

    .icon-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .icon-btn.danger:hover {
      border-color: var(--red);
      color: var(--red);
    }

    .summary-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }

    .summary-grid > *,
    .input-metric-grid > *,
    .dashboard-grid > *,
    .entry-grid > * {
      min-width: 0;
    }

    .metric-card,
    .panel,
    .tool-card,
    .history-card {
      min-width: 0;
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      background: var(--surface);
      box-shadow: var(--shadow-soft);
    }

    .metric-card {
      width: 100%;
      min-height: 116px;
      display: grid;
      align-content: space-between;
      gap: 12px;
      padding: 14px;
    }

    .metric-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: var(--text-muted);
      font-size: 0.84rem;
      font-weight: 650;
    }

    .metric-icon {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: var(--radius-control);
      background: var(--accent-soft);
      color: var(--accent);
    }

    .metric-icon.green {
      background: var(--green-soft);
      color: var(--green);
    }

    .metric-icon.red {
      background: var(--red-soft);
      color: var(--red);
    }

    .metric-value {
      overflow-wrap: anywhere;
      color: var(--text);
      font-size: 1.32rem;
      font-weight: 800;
      line-height: 1.08;
    }

    .metric-note {
      overflow-wrap: anywhere;
      color: var(--text-muted);
      font-size: 0.82rem;
      font-weight: 560;
    }

    .growth-badge,
    .pill,
    .status-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      border-radius: var(--radius-pill);
      padding: 5px 9px;
      font-size: 0.76rem;
      font-weight: 740;
      white-space: nowrap;
    }

    .growth-badge.pos {
      background: var(--green-soft);
      color: var(--green);
    }

    .growth-badge.neg {
      background: var(--red-soft);
      color: var(--red);
    }

    .growth-badge.neutral,
    .status-pill {
      background: var(--surface-muted);
      color: var(--text-soft);
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }

    .input-metric-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-bottom: 0;
    }

    .panel {
      padding: 14px;
    }

    .panel-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .panel-title {
      margin: 0;
      color: var(--text);
      font-size: 1.04rem;
      font-weight: 760;
      line-height: 1.2;
    }

    .panel-subtitle {
      margin: 4px 0 0;
      color: var(--text-muted);
      font-size: 0.84rem;
      font-weight: 520;
      line-height: 1.4;
    }

    .metric-toggle {
      display: inline-flex;
      gap: 4px;
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      padding: 4px;
      background: var(--surface-raised);
    }

    .toggle-btn {
      min-height: 32px;
      border-radius: var(--radius-pill);
      padding: 0 10px;
      background: transparent;
      color: var(--text-soft);
      font-size: 0.78rem;
      font-weight: 740;
      white-space: nowrap;
    }

    .toggle-btn.active {
      background: var(--surface-solid);
      color: var(--accent);
      box-shadow: var(--shadow-soft);
    }

    .chart-wrap {
      position: relative;
      height: 290px;
    }

    .chart-empty,
    .empty-state,
    .empty-inline {
      display: grid;
      place-items: center;
      border: 1px dashed var(--border-strong);
      border-radius: var(--radius-card);
      background: var(--surface-raised);
      color: var(--text-soft);
      text-align: center;
    }

    .chart-empty {
      min-height: 290px;
      padding: 22px;
    }

    .chart-empty strong,
    .empty-state strong {
      display: block;
      margin-top: 8px;
      color: var(--text);
      font-size: 1rem;
    }

    .chart-empty span,
    .empty-state span {
      display: block;
      margin-top: 5px;
      color: var(--text-muted);
      font-size: 0.86rem;
      line-height: 1.4;
    }

    .package-list {
      display: grid;
      gap: 10px;
    }

    .package-row,
    .pkg-input,
    .price-row {
      border: 1px solid var(--border);
      border-left: 4px solid var(--pkg);
      border-radius: var(--radius-card);
      background: var(--surface-solid);
    }

    .package-row {
      padding: 12px;
    }

    .package-row-top,
    .pkg-input-top,
    .history-card-top,
    .tool-card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .package-name,
    .pkg-input-name {
      color: var(--text);
      font-size: 0.94rem;
      font-weight: 760;
    }

    .package-meta,
    .pkg-hint,
    .price-meta {
      margin-top: 4px;
      color: var(--text-muted);
      font-size: 0.78rem;
      font-weight: 540;
      line-height: 1.4;
    }

    .qty-chip {
      border-radius: var(--radius-pill);
      padding: 4px 8px;
      background: var(--surface-muted);
      color: var(--text);
      font-size: 0.78rem;
      font-weight: 760;
      white-space: nowrap;
    }

    .subtotal-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
    }

    .subtotal-box {
      border-radius: var(--radius-card);
      padding: 9px;
      background: var(--surface-raised);
      color: var(--text-muted);
      font-size: 0.76rem;
      font-weight: 590;
    }

    .subtotal-box strong {
      display: block;
      margin-top: 3px;
      overflow-wrap: anywhere;
      color: var(--text);
      font-family: "SF Mono", "Cascadia Mono", Consolas, monospace;
      font-size: 0.78rem;
      font-weight: 700;
    }

    .progress-track {
      height: 5px;
      overflow: hidden;
      border-radius: var(--radius-pill);
      margin-top: 12px;
      background: var(--surface-muted);
    }

    .progress-track i {
      display: block;
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: var(--pkg);
      transition: width 280ms ease;
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      background: var(--surface-solid);
    }

    table {
      width: 100%;
      min-width: 720px;
      border-collapse: collapse;
      color: var(--text);
      font-size: 0.86rem;
    }

    th,
    td {
      padding: 12px 11px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      vertical-align: middle;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    th {
      color: var(--text-muted);
      font-size: 0.78rem;
      font-weight: 760;
    }

    .mono {
      font-family: "SF Mono", "Cascadia Mono", Consolas, monospace;
      font-variant-numeric: tabular-nums;
    }

    .sort-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 30px;
      border-radius: var(--radius-control);
      padding: 0 8px;
      background: transparent;
      color: inherit;
      font-size: inherit;
      font-weight: inherit;
    }

    .sort-btn:hover {
      background: var(--surface-muted);
      color: var(--text);
    }

    .history-mobile {
      display: grid;
      gap: 10px;
    }

    .history-desktop {
      display: none;
    }

    .history-card {
      padding: 13px;
    }

    .history-kpis {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
    }

    .history-kpi {
      border-radius: var(--radius-card);
      padding: 9px;
      background: var(--surface-raised);
      color: var(--text-muted);
      font-size: 0.76rem;
      font-weight: 590;
    }

    .history-kpi strong {
      display: block;
      margin-top: 3px;
      overflow-wrap: anywhere;
      color: var(--text);
      font-size: 0.82rem;
    }

    .history-total {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-top: 1px solid var(--border);
      margin-top: 12px;
      padding-top: 12px;
      color: var(--text);
      font-weight: 760;
    }

    .pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .pill {
      border: 1px solid var(--border);
      background: var(--surface-raised);
      color: var(--text-soft);
    }

    .row-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .entry-grid,
    .tools-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .price-grid {
      display: grid;
      gap: 9px;
    }

    .price-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px;
    }

    .price-values {
      display: grid;
      gap: 3px;
      text-align: right;
      white-space: nowrap;
    }

    .price-values strong {
      color: var(--text);
      font-size: 0.86rem;
    }

    .price-values span {
      color: var(--text-muted);
      font-size: 0.76rem;
      font-weight: 600;
    }

    .tool-card {
      display: grid;
      align-content: space-between;
      gap: 14px;
      min-height: 172px;
      padding: 14px;
    }

    .tool-icon {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border-radius: var(--radius-control);
      background: var(--accent-soft);
      color: var(--accent);
    }

    .muted {
      color: var(--text-muted);
      font-size: 0.88rem;
      font-weight: 520;
      line-height: 1.45;
    }

    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 88px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      align-items: end;
      gap: 2px;
      border: 0;
      padding: 12px 8px 10px;
      background: transparent;
      overflow: visible;
      z-index: 45;
    }

    .bottom-nav::before {
      content: "";
      position: absolute;
      inset: 0 8px 0;
      border: 1px solid var(--border);
      border-bottom: 0;
      border-radius: 26px 26px 0 0;
      background: var(--surface);
      box-shadow: 0 -18px 42px rgba(0, 74, 173, 0.12);
      pointer-events: none;
      z-index: 0;
      -webkit-mask: radial-gradient(circle 50px at 50% 0, transparent 0 48px, #000 49px);
      mask: radial-gradient(circle 50px at 50% 0, transparent 0 48px, #000 49px);
    }

    html[data-theme="dark"] .bottom-nav::before {
      box-shadow: 0 -18px 42px rgba(0, 0, 0, 0.38);
    }

    .bnav-btn {
      position: relative;
      z-index: 2;
      min-width: 0;
      min-height: 58px;
      display: grid;
      place-items: center;
      align-content: center;
      gap: 4px;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.68rem;
      font-weight: 700;
    }

    .bnav-btn span {
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .bnav-btn.active {
      color: var(--accent);
    }

    .bnav-fab {
      position: absolute;
      left: 50%;
      top: -32px;
      z-index: 3;
      width: 68px;
      height: 68px;
      display: grid;
      place-items: center;
      align-content: center;
      gap: 2px;
      justify-self: center;
      border: 0;
      border-radius: 25px;
      transform: translateX(-50%);
      background: var(--accent);
      color: #ffffff;
      box-shadow: 0 16px 34px rgba(0, 102, 255, 0.38);
      font-size: 0.67rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform 100ms ease, background 150ms ease, box-shadow 150ms ease;
    }

    .bnav-fab:active {
      transform: translateX(-50%) scale(0.96);
    }

    .bnav-fab:hover {
      background: var(--accent-strong);
      box-shadow: 0 18px 38px rgba(0, 102, 255, 0.44);
    }

    html[data-theme="dark"] .bnav-fab {
      box-shadow: 0 16px 34px rgba(0, 102, 255, 0.36);
    }

    .toast-wrap {
      position: fixed;
      top: 76px;
      left: 50%;
      z-index: 80;
      display: grid;
      gap: 8px;
      width: min(92vw, 390px);
      transform: translateX(-50%);
      pointer-events: none;
    }

    .toast {
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      padding: 11px 13px;
      background: var(--surface-solid);
      color: var(--text);
      box-shadow: var(--shadow);
      font-size: 0.88rem;
      font-weight: 700;
      animation: toastIn 180ms ease both;
    }

    .toast-icon {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 11px;
      background: var(--accent-soft);
      color: var(--accent);
    }

    .toast.success .toast-icon {
      background: var(--green-soft);
      color: var(--green);
    }

    .toast.error .toast-icon {
      background: var(--red-soft);
      color: var(--red);
    }

    .toast.warning .toast-icon {
      background: var(--amber-soft);
      color: var(--amber);
    }

    .toast.success {
      border-color: var(--green-soft);
      color: var(--green);
    }

    .toast.error {
      border-color: var(--red-soft);
      color: var(--red);
    }

    .toast.warning {
      border-color: var(--amber-soft);
      color: var(--amber);
    }

    .toast.info {
      border-color: var(--accent-soft);
      color: var(--accent);
    }

    @keyframes toastIn {
      from {
        opacity: 0;
        transform: translateY(-8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 70;
      display: none;
      background: rgba(0, 0, 0, 0.28);
      opacity: 0;
      transition: opacity 180ms ease;
    }

    html[data-theme="dark"] .modal {
      background: rgba(0, 0, 0, 0.55);
    }

    .modal.show {
      display: block;
      opacity: 1;
    }

    body.modal-open {
      overflow: hidden;
    }

    .modal-panel {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      max-height: 92vh;
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 18px 18px 0 0;
      background: var(--surface);
      box-shadow: var(--shadow);
      padding: 10px 14px 14px;
      transform: translateY(18px);
      transition: transform 180ms ease;
    }

    .modal.show .modal-panel {
      transform: translateY(0);
    }

    .modal-grabber {
      width: 38px;
      height: 4px;
      border-radius: var(--radius-pill);
      margin: 4px auto 10px;
      background: var(--border-strong);
    }

    .modal-header {
      position: sticky;
      top: -10px;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 1px solid var(--border);
      margin: 0 -14px 14px;
      padding: 10px 14px 12px;
      background: var(--surface);
    }

    .modal-title {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 0;
      color: var(--text);
      font-size: 1.12rem;
      font-weight: 780;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .field {
      display: grid;
      gap: 6px;
      margin-bottom: 12px;
    }

    .field label {
      color: var(--text-soft);
      font-size: 0.82rem;
      font-weight: 690;
    }

    .field select,
    .field input[type="number"],
    .field input[type="text"] {
      width: 100%;
      min-height: 42px;
      border: 1px solid var(--border);
      border-radius: var(--radius-control);
      padding: 0 11px;
      outline: none;
      background: var(--surface-solid);
      color: var(--text);
      font-size: 0.92rem;
      font-weight: 650;
    }

    .field select:focus,
    .field input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-soft);
    }

    .field.invalid select,
    .field.invalid input {
      border-color: var(--red);
      box-shadow: 0 0 0 4px var(--red-soft);
    }

    .form-section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 4px 0 10px;
    }

    .form-section-head h4 {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0;
      color: var(--text);
      font-size: 0.98rem;
      font-weight: 760;
    }

    .pkg-input-grid {
      display: grid;
      gap: 10px;
    }

    .pkg-input {
      padding: 12px;
    }

    .qty-control {
      display: grid;
      grid-template-columns: 38px 64px 38px;
      align-items: center;
      gap: 6px;
    }

    .q-btn {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: var(--radius-control);
      background: var(--surface-muted);
      color: var(--text);
    }

    .q-btn:hover {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .qty-input {
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .form-summary {
      position: sticky;
      bottom: -1px;
      display: grid;
      gap: 8px;
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      margin-top: 12px;
      padding: 12px;
      background: var(--surface-solid);
      box-shadow: var(--shadow-soft);
    }

    .summary-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--text-soft);
      font-size: 0.88rem;
      font-weight: 620;
    }

    .summary-row strong {
      overflow-wrap: anywhere;
      color: var(--text);
      font-family: "SF Mono", "Cascadia Mono", Consolas, monospace;
      font-size: 0.88rem;
    }

    .summary-row.final {
      border-top: 1px solid var(--border);
      padding-top: 8px;
      color: var(--text);
      font-weight: 780;
    }

    .summary-row.final strong {
      color: var(--accent);
      font-size: 1rem;
    }

    .actions-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }

    .skeleton-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .skeleton {
      min-height: 132px;
      overflow: hidden;
      border-radius: var(--radius-card);
      background: var(--surface-muted);
      position: relative;
    }

    .skeleton::after {
      content: "";
      position: absolute;
      inset: 0;
      transform: translateX(-100%);
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.55), transparent);
      animation: shimmer 1100ms linear infinite;
    }

    html[data-theme="dark"] .skeleton::after {
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.08), transparent);
    }

    @keyframes shimmer {
      to {
        transform: translateX(100%);
      }
    }

    @media (min-width: 360px) and (max-width: 767px) {
      .summary-grid,
      .skeleton-grid,
      .input-metric-grid {
        grid-template-columns: repeat(2, minmax(0, calc((100vw - 38px) / 2)));
      }
    }

    @media (min-width: 520px) {
      .tools-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (min-width: 768px) {
      .main {
        padding: 88px 20px 34px;
      }

      .tablet-links {
        display: flex;
      }

      .bottom-nav {
        display: none;
      }

      .summary-grid,
      .skeleton-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .dashboard-grid {
        grid-template-columns: minmax(0, 1.4fr) minmax(330px, 0.85fr);
      }

      .entry-grid {
        grid-template-columns: minmax(0, 1fr) minmax(330px, 1fr);
      }

      .chart-wrap,
      .chart-empty {
        height: 310px;
      }

      .history-mobile {
        display: none;
      }

      .history-desktop {
        display: block;
      }

      .toast-wrap {
        left: auto;
        right: 18px;
        transform: none;
      }

      .modal-panel {
        left: 50%;
        right: auto;
        bottom: auto;
        top: 50%;
        width: min(620px, calc(100vw - 28px));
        max-height: min(88vh, 820px);
        border-radius: 18px;
        transform: translate(-50%, -47%);
      }

      .modal.show .modal-panel {
        transform: translate(-50%, -50%);
      }
    }

    @media (min-width: 1024px) {
      .sidebar {
        display: block;
      }

      .topbar {
        display: none;
      }

      .main {
        margin-left: var(--sidebar-width);
        width: calc(100% - var(--sidebar-width));
        max-width: none;
        padding: 24px 28px 38px;
      }

      .page-title {
        font-size: 1.45rem;
      }

      .metric-card {
        min-height: 112px;
        padding: 13px;
      }

      .metric-value {
        font-size: 1.18rem;
      }

      .panel {
        padding: 13px;
      }

      .dashboard-grid {
        grid-template-columns: 1fr;
        align-items: start;
      }

      .package-list {
        gap: 8px;
      }

      .package-row {
        padding: 10px;
      }

      .subtotal-grid {
        margin-top: 9px;
      }

      .chart-wrap,
      .chart-empty {
        height: 300px;
      }

      .tools-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .entry-grid {
        grid-template-columns: 1fr;
      }

      .modal-panel {
        left: auto;
        right: 0;
        top: 0;
        bottom: 0;
        width: min(520px, 100vw);
        max-height: 100vh;
        border-radius: 0;
        transform: translateX(100%);
      }

      .modal.show .modal-panel {
        transform: translateX(0);
      }

      .modal-grabber {
        display: none;
      }
    }

    @media (min-width: 1200px) {
      .dashboard-grid {
        grid-template-columns: minmax(0, 1.45fr) minmax(360px, 0.8fr);
      }

      .entry-grid {
        grid-template-columns: minmax(0, 0.95fr) minmax(420px, 1.05fr);
      }
    }

    @media (min-width: 1280px) {
      .tools-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }

    @media (min-width: 1440px) {
      .main {
        padding-left: 36px;
        padding-right: 36px;
      }

      .dashboard-grid {
        grid-template-columns: minmax(0, 1.65fr) minmax(430px, 0.85fr);
      }

      .package-list {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .chart-wrap,
      .chart-empty {
        height: 340px;
      }
    }

    @media (max-width: 640px) {
      .page-head {
        display: grid;
      }

      .page-head .btn {
        width: 100%;
      }

      .panel-head {
        display: grid;
      }

      .metric-toggle {
        width: 100%;
        overflow-x: auto;
      }

      .toggle-btn {
        flex: 1 0 auto;
      }

      .pkg-input-top,
      .package-row-top,
      .price-row {
        display: grid;
      }

      .qty-control {
        justify-content: start;
      }

      .price-values {
        text-align: left;
      }
    }

    /* Liquid interface refresh */
    :root {
      --bg: #edf5ff;
      --surface: rgba(255, 255, 255, 0.62);
      --surface-solid: rgba(255, 255, 255, 0.9);
      --surface-raised: rgba(245, 249, 255, 0.82);
      --surface-muted: rgba(211, 228, 250, 0.54);
      --accent: #087cff;
      --accent-strong: #0063db;
      --violet: #6e5cff;
      --cyan: #00a6d7;
      --radius-card: 24px;
      --radius-control: 16px;
      --shadow: 0 28px 80px rgba(31, 75, 137, 0.2);
      --shadow-soft: 0 14px 40px rgba(50, 91, 145, 0.1);
    }

    html[data-theme="dark"] {
      --surface: rgba(24, 30, 43, 0.62);
      --surface-solid: rgba(28, 34, 48, 0.92);
      --surface-raised: rgba(34, 42, 58, 0.8);
      --surface-muted: rgba(66, 81, 108, 0.42);
    }

    body {
      min-height: 100dvh;
      background:
        radial-gradient(circle at 8% 4%, rgba(84, 174, 255, 0.3), transparent 34%),
        radial-gradient(circle at 96% 24%, rgba(141, 108, 255, 0.2), transparent 30%),
        linear-gradient(155deg, #f8fbff 0%, #eaf3ff 48%, #f7f1ff 100%);
      background-attachment: fixed;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      z-index: -1;
      width: 44vw;
      height: 44vw;
      border-radius: 50%;
      filter: blur(74px);
      opacity: 0.3;
      pointer-events: none;
      animation: ambientFloat 14s ease-in-out infinite alternate;
    }

    body::before { left: -18vw; top: 26vh; background: #2b9eff; }
    body::after { right: -17vw; bottom: 8vh; background: #8a68ff; animation-delay: -7s; }
    html[data-theme="dark"] body { background: radial-gradient(circle at 12% 5%, #132b4a 0, transparent 34%), radial-gradient(circle at 95% 20%, #261e4e 0, transparent 34%), #080b12; }

    @keyframes ambientFloat {
      to { transform: translate3d(5vw, -4vh, 0) scale(1.12); }
    }

    .sidebar,
    .topbar,
    .bottom-nav::before,
    .panel,
    .metric-card,
    .tool-card,
    .history-card,
    .modal-panel,
    .lifetime-strip,
    .insight-card,
    .dream-hero {
      -webkit-backdrop-filter: blur(30px) saturate(175%);
      backdrop-filter: blur(30px) saturate(175%);
    }

    .metric-card,
    .panel,
    .tool-card,
    .history-card,
    .lifetime-strip,
    .insight-card,
    .dream-hero {
      position: relative;
      overflow: hidden;
      border-color: rgba(255, 255, 255, 0.58);
      box-shadow: var(--shadow-soft), inset 0 1px 0 rgba(255,255,255,.7);
    }

    html[data-theme="dark"] .metric-card,
    html[data-theme="dark"] .panel,
    html[data-theme="dark"] .tool-card,
    html[data-theme="dark"] .history-card,
    html[data-theme="dark"] .lifetime-strip,
    html[data-theme="dark"] .insight-card,
    html[data-theme="dark"] .dream-hero { border-color: rgba(255,255,255,.1); box-shadow: var(--shadow-soft), inset 0 1px 0 rgba(255,255,255,.1); }

    .metric-card::after,
    .insight-card::after,
    .dream-hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(125deg, rgba(255,255,255,.32), transparent 32%);
      pointer-events: none;
    }

    .brand-mark {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.66);
      border-radius: 14px;
      background: linear-gradient(145deg, #20a8ff, #1769ef 52%, #7449e8);
      color: #fff;
      box-shadow: 0 9px 24px rgba(26, 107, 235, .25), inset 0 1px 1px rgba(255,255,255,.72);
    }

    .brand-mark::after { content:""; position:absolute; inset:1px; border-radius:12px; background:linear-gradient(145deg,rgba(255,255,255,.3),transparent 42%); pointer-events:none; }
    .brand-mark .icon { filter: drop-shadow(0 2px 2px rgba(0,0,0,.2)); }

    .topbar {
      top: max(10px, env(safe-area-inset-top));
      left: 10px;
      right: 10px;
      min-height: 58px;
      border: 1px solid rgba(255,255,255,.62);
      border-radius: 22px;
      box-shadow: 0 12px 36px rgba(46, 78, 124, .12), inset 0 1px 0 rgba(255,255,255,.75);
    }

    .main { padding-top: calc(84px + env(safe-area-inset-top)); }
    .page-title { font-size: clamp(1.72rem, 5vw, 2.5rem); letter-spacing: -.045em; font-weight: 820; }
    .page-kicker { margin: 0 0 7px; color: var(--accent); font-size: .72rem; font-weight: 820; letter-spacing: .12em; text-transform: uppercase; }

    .btn,
    .icon-btn,
    .q-btn,
    .toggle-btn,
    .bnav-btn,
    .nav-btn { position: relative; overflow: hidden; }

    .btn { border: 1px solid rgba(255,255,255,.32); background: linear-gradient(145deg, #2498ff, #096be8); box-shadow: 0 10px 24px rgba(0,105,225,.22), inset 0 1px 0 rgba(255,255,255,.46); }
    .btn:active, .icon-btn:active, .q-btn:active, .nav-btn:active, .bnav-btn:active { transform: scale(.94); }
    .tap-pulse::after { content:""; position:absolute; inset:0; border-radius:inherit; background:rgba(255,255,255,.34); animation:tapFlash .36s ease-out both; pointer-events:none; }
    @keyframes tapFlash { from { opacity:1; transform:scale(.7); } to { opacity:0; transform:scale(1.25); } }

    .dashboard-toolbar { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; }
    .month-filter { display:flex; align-items:center; gap:8px; min-height:42px; border:1px solid var(--border); border-radius:16px; padding:0 11px; background:var(--surface); color:var(--text); box-shadow:inset 0 1px 0 rgba(255,255,255,.65); }
    .month-filter select { max-width:150px; border:0; outline:0; background:transparent; color:inherit; font-weight:760; }

    .lifetime-strip { display:grid; grid-template-columns:1fr; gap:1px; border:1px solid var(--border); border-radius:24px; margin:0 0 14px; padding:6px; background:var(--surface); }
    .lifetime-item { min-width:0; border-radius:19px; padding:14px; background:rgba(255,255,255,.25); }
    .lifetime-item span { display:block; color:var(--text-muted); font-size:.73rem; font-weight:710; }
    .lifetime-item strong { display:block; margin-top:5px; overflow-wrap:anywhere; color:var(--text); font-size:1rem; letter-spacing:-.025em; }

    .insights-grid { display:grid; grid-template-columns:1fr; gap:12px; margin-top:14px; }
    .insight-card { min-height:188px; border:1px solid var(--border); border-radius:24px; padding:16px; background:var(--surface); }
    .insight-card.featured { color:#fff; border-color:rgba(255,255,255,.24); background:linear-gradient(145deg, rgba(20,132,255,.94), rgba(93,74,224,.92)); box-shadow:0 22px 50px rgba(49,92,214,.28); }
    .insight-card.featured .insight-label, .insight-card.featured .insight-copy, .insight-card.featured .muted { color:rgba(255,255,255,.76); }
    .insight-card.featured .insight-value, .insight-card.featured .package-name { color:#fff; }
    .insight-head { display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .insight-icon { width:38px; height:38px; display:grid; place-items:center; border-radius:14px; background:var(--accent-soft); color:var(--accent); }
    .featured .insight-icon { background:rgba(255,255,255,.16); color:#fff; box-shadow:inset 0 1px 0 rgba(255,255,255,.22); }
    .insight-label { color:var(--text-muted); font-size:.75rem; font-weight:790; letter-spacing:.06em; text-transform:uppercase; }
    .insight-value { margin-top:16px; color:var(--text); font-size:1.35rem; font-weight:820; letter-spacing:-.035em; }
    .insight-copy { margin:6px 0 0; color:var(--text-muted); font-size:.82rem; line-height:1.5; }
    .prediction-list, .recommend-list { display:grid; gap:8px; margin-top:13px; }

    html[data-theme="dark"] .nav-glider { border-color:rgba(255,255,255,.12); background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.04)); box-shadow:inset 0 1px 0 rgba(255,255,255,.12); }

    .bnav-btn.active .icon { filter:drop-shadow(0 4px 7px rgba(0,122,255,.24)); }
    .bnav-fab { position:relative; left:auto; top:-25px; z-index:4; width:66px; height:66px; border:1px solid rgba(255,255,255,.64); border-radius:23px; transform:perspective(140px) rotateX(5deg); background:linear-gradient(145deg,#48b4ff 0%,#0b78ed 48%,#5146db 100%); box-shadow:0 17px 26px rgba(15,94,214,.38), 0 5px 0 #0757b7, inset 0 2px 1px rgba(255,255,255,.64), inset 0 -5px 12px rgba(20,35,130,.25); transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .18s ease; }
    .bnav-fab::before { content:""; position:absolute; inset:5px; border:1px solid rgba(255,255,255,.2); border-radius:18px; background:linear-gradient(145deg,rgba(255,255,255,.2),transparent 45%); }
    .bnav-fab .icon, .bnav-fab span { position:relative; z-index:1; }
    .bnav-fab:active { transform:translateY(4px) perspective(140px) rotateX(0) scale(.96); box-shadow:0 8px 16px rgba(15,94,214,.28), 0 2px 0 #0757b7, inset 0 2px 1px rgba(255,255,255,.5); }
    .main { padding-bottom:calc(112px + env(safe-area-inset-bottom)); }

    .modal.show .modal-panel { animation:sheetSpring .52s cubic-bezier(.16,.86,.25,1.08) both; }
    @keyframes sheetSpring { 0% { opacity:0; transform:translateY(105%); } 72% { opacity:1; transform:translateY(-7px); } 100% { opacity:1; transform:translateY(0); } }

    @media (min-width: 520px) {

      *, *::before, *::after { scroll-behavior:auto !important; animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }

  <script>
    const STORAGE_KEY = 'bbi_revenue_v1';
    const THEME_KEY = 'bbi_theme';
    const DREAM_KEY = 'bbi_dream_target';
    const MONTHS = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
    const VIEWS = ['dashboard', 'input', 'history', 'dream', 'tools'];

    const PACKAGES = [
      { id: 'alpha', name: 'Paket Alpha', color: '#0a84ff', income: 100000, checkout: 25000 },
      { id: 'spesial', name: 'Paket Spesial', color: '#bf5af2', income: 199000, checkout: 70000 },
      { id: 'sigma', name: 'Paket Sigma', color: '#00a6d7', income: 239000, checkout: 110000 },
      { id: 'diamond', name: 'Paket Diamond', color: '#30b85b', income: 289000, checkout: 150000 },
      { id: 'secret', name: 'Paket Secret', color: '#ff8a16', income: 389000, checkout: 265000 },
    ];

    const state = {
      currentView: 'dashboard',
      data: [],
      formQty: defaultQty(),
      editingId: null,
      formDirty: false,
      chartInstance: null,
      chartMetric: 'sisaBersih',
      dashboardMonth: 'latest',
      dreamTarget: 1000000,
      deferredInstallPrompt: null,
      loading: true,
      historySort: { key: 'yearMonth', dir: 'desc' },
      importPreview: null,
    };

    function icon(name, size = 18) {
      return `<svg class="icon" width="${size}" height="${size}" aria-hidden="true"><use href="#i-${name}"></use></svg>`;
    }

    function defaultQty() {
      return PACKAGES.reduce((acc, pkg) => {
        acc[pkg.id] = 0;
        return acc;
      }, {});
    }

    function parseQty(value) {
      const num = Number.parseInt(value, 10);
      return Number.isInteger(num) && num >= 0 ? num : 0;
    }

    function formatRupiah(value) {
      return `Rp ${Math.round(value || 0).toLocaleString('id-ID')}`;
    }

    function formatCompactRupiah(value) {
      const n = Number(value || 0);
      const abs = Math.abs(n);
      if (abs >= 1000000000) return `Rp ${(n / 1000000000).toLocaleString('id-ID', { maximumFractionDigits: 1 })} M`;
      if (abs >= 1000000) return `Rp ${(n / 1000000).toLocaleString('id-ID', { maximumFractionDigits: 1 })} jt`;
      if (abs >= 1000) return `Rp ${(n / 1000).toLocaleString('id-ID', { maximumFractionDigits: 0 })} rb`;
      return formatRupiah(n);
    }

    function formatMonth(month, year) {
      return `${MONTHS[(month || 1) - 1]} ${year}`;
    }

    function yearMonthId(month, year) {
      return `${year}-${String(month).padStart(2, '0')}`;
    }

    function calcTotals(qtyMap) {
      return PACKAGES.reduce((acc, pkg) => {
        const qty = parseQty(qtyMap?.[pkg.id]);
        acc.totalPemasukan += qty * pkg.income;
        acc.totalCheckout += qty * pkg.checkout;
        acc.packageTotals[pkg.id] = {
          qty,
          subtotalIn: qty * pkg.income,
          subtotalOut: qty * pkg.checkout,
        };
        return acc;
      }, { totalPemasukan: 0, totalCheckout: 0, packageTotals: {} });
    }

    function calcGrowth(current, previous) {
      if (!Number.isFinite(previous) || previous === 0) return null;
      return ((current - previous) / previous) * 100;
    }

    function formatGrowth(pct) {
      if (pct === null || !Number.isFinite(pct)) return { text: 'N/A', cls: 'neutral' };
      const sign = pct >= 0 ? '+' : '-';
      const value = Math.abs(pct).toLocaleString('id-ID', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
      return { text: `${sign}${value}%`, cls: pct >= 0 ? 'pos' : 'neg' };
    }

    function sortAsc(data) {
      return [...data].sort((a, b) => (a.year - b.year) || (a.month - b.month));
    }

    function sortDesc(data) {
      return [...data].sort((a, b) => (b.year - a.year) || (b.month - a.month));
    }

    function normalizeRecord(item) {
      if (!item || typeof item !== 'object') return null;
      const month = Number(item.month);
      const year = Number(item.year);
      if (!Number.isInteger(month) || month < 1 || month > 12) return null;
      if (!Number.isInteger(year) || year < 1900 || year > 3000) return null;

      const packages = defaultQty();
      PACKAGES.forEach((pkg) => {
        packages[pkg.id] = parseQty(item.packages?.[pkg.id]);
      });

      const totals = calcTotals(packages);
      const now = new Date().toISOString();
      return {
        id: yearMonthId(month, year),
        month,
        year,
        label: formatMonth(month, year),
        packages,
        totalPemasukan: totals.totalPemasukan,
        totalCheckout: totals.totalCheckout,
        sisaBersih: totals.totalPemasukan - totals.totalCheckout,
        createdAt: item.createdAt || now,
        updatedAt: item.updatedAt || now,
      };
    }

    function loadData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return [];
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed)) return [];
        return sortAsc(parsed.map(normalizeRecord).filter(Boolean));
      } catch {
        return [];
      }
    }

    function saveData() {
      state.data = sortAsc(state.data);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data));
      updateActiveMonthBadge();
    }

    function exportJSON() {
      const blob = new Blob([JSON.stringify(state.data, null, 2)], { type: 'application/json' });
      const anchor = document.createElement('a');
      const date = new Date().toISOString().slice(0, 10);
      anchor.href = URL.createObjectURL(blob);
      anchor.download = `bbi-cash-backup-${date}.json`;
      anchor.click();
      URL.revokeObjectURL(anchor.href);
    }

    async function parseImportFile(file) {
      const text = await file.text();
      const parsed = JSON.parse(text);
      if (!Array.isArray(parsed)) throw new Error('Format JSON harus berupa array');
      const normalized = parsed.map(normalizeRecord).filter(Boolean);
      if (!normalized.length && parsed.length > 0) throw new Error('Struktur data tidak valid');
      return sortAsc(normalized);
    }

    function importJSON(incoming, mode) {
      if (mode === 'replace') {
        state.data = sortAsc(incoming);
      } else {
        const map = new Map(state.data.map((row) => [row.id, row]));
        incoming.forEach((row) => map.set(row.id, row));
        state.data = sortAsc([...map.values()]);
      }
      saveData();
      renderApp();
    }

    function getGrowthMap() {
      const sorted = sortAsc(state.data);
      const map = new Map();
      sorted.forEach((item, index) => {
        const previous = sorted[index - 1];
        map.set(item.id, calcGrowth(item.sisaBersih, previous?.sisaBersih));
      });
      return map;
    }

    function getLatest() {
      const sorted = sortAsc(state.data);
      return sorted[sorted.length - 1] || null;
    }

    function getPreviousLatest() {
      const sorted = sortAsc(state.data);
      return sorted[sorted.length - 2] || null;
    }

    function getTotalQty(qtyMap) {
      return PACKAGES.reduce((sum, pkg) => sum + parseQty(qtyMap?.[pkg.id]), 0);
    }

    function getBestPackage(row) {
      if (!row) return null;
      return PACKAGES.reduce((best, pkg) => {
        const qty = parseQty(row.packages[pkg.id]);
        if (!best || qty > best.qty) return { pkg, qty };
        return best;
      }, null);
    }

    function packageProfit(pkg) {
      return pkg.income - pkg.checkout;
    }

    function packageMargin(pkg) {
      return pkg.income ? (packageProfit(pkg) / pkg.income) * 100 : 0;
    }

    function getDashboardRecord() {
      if (state.dashboardMonth === 'latest') return getLatest();
      const selected = state.data.find((row) => row.id === state.dashboardMonth);
      if (selected) return selected;
      state.dashboardMonth = 'latest';
      return getLatest();
    }

    function getAllTimeTotals() {
      return state.data.reduce((totals, row) => {
        totals.income += Number(row.totalPemasukan || 0);
        totals.checkout += Number(row.totalCheckout || 0);
        totals.profit += Number(row.sisaBersih || 0);
        totals.qty += getTotalQty(row.packages);
        PACKAGES.forEach((pkg) => {
          const qty = parseQty(row.packages?.[pkg.id]);
          totals.byPackage[pkg.id].qty += qty;
          totals.byPackage[pkg.id].profit += qty * packageProfit(pkg);
        });
        return totals;
      }, {
        income: 0,
        checkout: 0,
        profit: 0,
        qty: 0,
        byPackage: PACKAGES.reduce((acc, pkg) => {
          acc[pkg.id] = { qty: 0, profit: 0 };
          return acc;
        }, {}),
      });
    }

    function getProfitLeaders() {
      const all = getAllTimeTotals();
      const realized = [...PACKAGES]
        .map((pkg) => ({ pkg, ...all.byPackage[pkg.id] }))
        .sort((a, b) => b.profit - a.profit)[0];
      const perUnit = [...PACKAGES]
        .map((pkg) => ({ pkg, profit: packageProfit(pkg), margin: packageMargin(pkg) }))
        .sort((a, b) => b.profit - a.profit)[0];
      return { realized, perUnit };
    }

    function getNextMonthLabel() {
      const latest = getLatest();
      const date = latest ? new Date(latest.year, latest.month, 1) : new Date();
      return formatMonth(date.getMonth() + 1, date.getFullYear());
    }

    function getPrediction() {
      const rows = sortAsc(state.data).slice(-6);
      if (!rows.length) return null;
      const quantities = {};
      PACKAGES.forEach((pkg) => {
        const values = rows.map((row) => parseQty(row.packages?.[pkg.id]));
        const weightTotal = values.reduce((sum, _, index) => sum + index + 1, 0);
        const weightedAverage = values.reduce((sum, value, index) => sum + value * (index + 1), 0) / weightTotal;
        const trend = values.length > 1 ? (values[values.length - 1] - values[0]) / (values.length - 1) : 0;
        quantities[pkg.id] = Math.max(0, Math.round(weightedAverage + trend * 0.35));
      });
      const totals = calcTotals(quantities);
      const confidence = Math.min(88, 42 + rows.length * 8);
      return {
        label: getNextMonthLabel(),
        quantities,
        totals,
        profit: totals.totalPemasukan - totals.totalCheckout,
        confidence,
        sampleSize: rows.length,
      };
    }

    function buildDreamPlan(target = state.dreamTarget) {
      const cleanTarget = Math.max(0, Math.round(Number(target) || 0));
      const prediction = getPrediction();
      const baseQty = prediction ? { ...prediction.quantities } : defaultQty();
      const baseProfit = prediction?.profit || 0;
      const historyTotals = getAllTimeTotals();
      const ranked = [...PACKAGES].sort((a, b) => {
        const aSeen = historyTotals.byPackage[a.id].qty;
        const bSeen = historyTotals.byPackage[b.id].qty;
        const aScore = packageProfit(a) * (aSeen ? 1 + Math.log10(aSeen + 1) * 0.18 : 0.76);
        const bScore = packageProfit(b) * (bSeen ? 1 + Math.log10(bSeen + 1) * 0.18 : 0.76);
        return bScore - aScore;
      });
      const focus = ranked[0];
      const recommended = { ...baseQty };
      const gap = Math.max(0, cleanTarget - baseProfit);
      const extra = focus ? Math.ceil(gap / packageProfit(focus)) : 0;
      if (focus) recommended[focus.id] += extra;
      const recommendedTotals = calcTotals(recommended);
      const recommendedProfit = recommendedTotals.totalPemasukan - recommendedTotals.totalCheckout;
      return { cleanTarget, prediction, baseQty, baseProfit, recommended, recommendedProfit, focus, extra };
    }

      const iconWrap = document.createElement('span');
      iconWrap.className = 'toast-icon';

      const text = document.createElement('span');
      text.textContent = message;
      toast.append(iconWrap, text);
      wrap.appendChild(toast);
      setTimeout(() => {

      }, 2600);
      setTimeout(() => toast.remove(), 3000);

    function animateCounter(el, to, duration = 520) {
      const start = performance.now();
      const from = 0;
      const diff = to - from;
      function tick(now) {
        const progress = Math.min((now - start) / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 3);
        el.textContent = formatRupiah(from + diff * eased);
        if (progress < 1) requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    }

    function createHoverLinePlugin(color) {
      return {
        id: 'hoverLine',
        afterDatasetsDraw(chart) {
          const active = chart.tooltip?.getActiveElements?.() || [];
          if (!active.length) return;
          const { ctx, chartArea } = chart;
          const x = active[0].element.x;
          ctx.save();
          ctx.beginPath();
          ctx.setLineDash([4, 5]);
          ctx.moveTo(x, chartArea.top + 4);
          ctx.lineTo(x, chartArea.bottom);
          ctx.lineWidth = 1;
          ctx.strokeStyle = color;
          ctx.globalAlpha = 0.55;
          ctx.stroke();
          ctx.restore();
        },
      };
    }

    function sortedForHistory() {
      const rows = [...state.data];
      const { key, dir } = state.historySort;
      const factor = dir === 'asc' ? 1 : -1;
      rows.sort((a, b) => {
        if (key === 'yearMonth') return factor * ((a.year - b.year) || (a.month - b.month));
        if (key === 'totalPemasukan') return factor * (a.totalPemasukan - b.totalPemasukan);
        if (key === 'totalCheckout') return factor * (a.totalCheckout - b.totalCheckout);
        if (key === 'sisaBersih') return factor * (a.sisaBersih - b.sisaBersih);
        return factor * ((a.year - b.year) || (a.month - b.month));
      });
      return rows;
    }

    function sortIcon(key) {
      if (state.historySort.key !== key) return '';
      return state.historySort.dir === 'asc' ? icon('arrow-up', 14) : icon('arrow-down', 14);
    }

    function navigate(view, rerenderChart = true, pushHistory = true) {
      if (!VIEWS.includes(view)) view = 'dashboard';
      state.currentView = view;
      document.querySelectorAll('.view').forEach((el) => {
        el.classList.toggle('active', el.id === `view-${view}`);
      });
      document.querySelectorAll('[data-nav]').forEach((el) => {
        el.classList.toggle('active', el.dataset.nav === view);
      });
      const navSlots = { dashboard: 0, history: 1, dream: 3, tools: 4 };
      const bottomNav = document.querySelector('.bottom-nav');
      if (bottomNav && Object.hasOwn(navSlots, view)) {
        bottomNav.style.setProperty('--nav-slot', navSlots[view]);
      }
      if (pushHistory && history.state?.view !== view) {
        history.pushState({ view }, '', `#${view}`);
      }
      if (view === 'dashboard' && rerenderChart && !state.loading) {
        setTimeout(renderChart, 0);
      }
    }

    function buildYearOptions(selectedYear) {
      const now = new Date().getFullYear();
      const years = new Set();
      for (let y = now - 2; y <= now + 2; y += 1) years.add(y);
      years.add(selectedYear);
      return [...years].sort((a, b) => a - b);
    }

    function closeForm(force = false) {
      const modal = document.getElementById('formModal');
      if (!modal.classList.contains('show')) return;
      if (!force && state.formDirty && !confirm('Ada perubahan belum disimpan. Tutup form?')) return;
      modal.classList.remove('show');
      modal.setAttribute('aria-hidden', 'true');
      document.body.classList.remove('modal-open');
      state.formDirty = false;
      setTimeout(() => {
        if (!modal.classList.contains('show')) modal.innerHTML = '';
      }, 180);
    }

    function updatePackageInputUI() {
      const totals = calcTotals(state.formQty);
      const totalQty = getTotalQty(state.formQty);
      PACKAGES.forEach((pkg) => {
        const row = document.querySelector(`[data-pkg-row="${pkg.id}"]`);
        if (!row) return;
        const qty = parseQty(state.formQty[pkg.id]);
        const input = row.querySelector(`[data-pkg-input="${pkg.id}"]`);
        if (input && document.activeElement !== input) input.value = String(qty);
        row.querySelector('[data-sub-in]').textContent = formatRupiah(totals.packageTotals[pkg.id].subtotalIn);
        row.querySelector('[data-sub-out]').textContent = formatRupiah(totals.packageTotals[pkg.id].subtotalOut);

      const margin = totals.totalPemasukan ? (sisa / totals.totalPemasukan) * 100 : 0;
      box.innerHTML = `

    function detectDuplicateMode() {
      const monthEl = document.getElementById('formMonth');
      const yearEl = document.getElementById('formYear');
      const pill = document.getElementById('editModePill');
      if (!monthEl || !yearEl || !pill) return;
      const id = yearMonthId(Number(monthEl.value), Number(yearEl.value));
      const existing = state.data.find((row) => row.id === id);

      if (existing && state.editingId !== existing.id) {
        state.editingId = existing.id;
        state.formQty = { ...existing.packages };
        const grid = document.getElementById('pkgInputGrid');
        if (grid) grid.innerHTML = renderPackageInputs(state.formQty);
        updatePackageInputUI();
        updateFormSummary();
        showToast('Data bulan ini ditemukan', 'info');
      }

      if (!existing) {
        state.editingId = null;
      }

      pill.hidden = !existing;
    }

    function validateForm() {
      const monthField = document.getElementById('fieldMonth');
      const yearField = document.getElementById('fieldYear');
      monthField.classList.remove('invalid');
      yearField.classList.remove('invalid');

      const month = Number(document.getElementById('formMonth')?.value);
      const year = Number(document.getElementById('formYear')?.value);
      let ok = true;
      if (!Number.isInteger(month) || month < 1 || month > 12) {
        monthField.classList.add('invalid');
        ok = false;
      }
      if (!Number.isInteger(year) || year < 1900 || year > 3000) {
        yearField.classList.add('invalid');
        ok = false;
      }
      return ok;
    }

    function submitForm() {
      if (!validateForm()) {
        showToast('Periksa bulan dan tahun', 'error');
        return;
      }

      const month = Number(document.getElementById('formMonth').value);
      const year = Number(document.getElementById('formYear').value);
      const id = yearMonthId(month, year);
      const totals = calcTotals(state.formQty);
      const now = new Date().toISOString();
      const index = state.data.findIndex((row) => row.id === id);
      const createdAt = index >= 0 ? state.data[index].createdAt : now;

      const record = {
        id,
        month,
        year,
        label: formatMonth(month, year),
        packages: { ...state.formQty },
        totalPemasukan: totals.totalPemasukan,
        totalCheckout: totals.totalCheckout,
        sisaBersih: totals.totalPemasukan - totals.totalCheckout,
        createdAt,
        updatedAt: now,
      };

      if (index >= 0) state.data[index] = record;
      else state.data.push(record);

      saveData();
      closeForm(true);
      state.currentView = 'dashboard';
      state.dashboardMonth = id;
      renderApp();
      showToast('Data berhasil disimpan', 'success');
    }

      const first = preview[0];
      const last = preview[preview.length - 1];
      modal.innerHTML = `
        <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="importTitle">
          <div class="modal-grabber"></div>
          <div class="modal-header">
            <h3 class="modal-title" id="importTitle">${icon('file', 18)}Preview Import</h3>
            <button class="icon-btn" data-close-import title="Tutup" aria-label="Tutup">${icon('close', 18)}</button>
          </div>
          <div class="panel" style="margin-bottom:12px">
            <div class="summary-row"><span>Jumlah data</span><strong>${preview.length} bulan</strong></div>
            <div class="summary-row"><span>Rentang</span><strong>${first?.label || '-'} s/d ${last?.label || '-'}</strong></div>
          </div>
          <div class="actions-row" style="grid-template-columns:1fr">
            <button class="btn" data-import-mode="merge">${icon('plus', 16)}Gabungkan Data</button>
            <button class="btn warning" data-import-mode="replace">${icon('download', 16)}Ganti Semua Data</button>
            <button class="btn secondary" data-close-import>Batal</button>
          </div>
        </div>
      `;
      modal.classList.add('show');
      modal.setAttribute('aria-hidden', 'false');
      document.body.classList.add('modal-open');
    }

    function closeImportModal() {
      const modal = document.getElementById('importModal');
      if (!modal.classList.contains('show')) return;
      modal.classList.remove('show');
      modal.setAttribute('aria-hidden', 'true');
      document.body.classList.remove('modal-open');
      setTimeout(() => {
        if (!modal.classList.contains('show')) modal.innerHTML = '';
      }, 180);
    }

    function resetDataFlow() {
      const step1 = confirm('Yakin ingin reset semua data?');
      if (!step1) return;
      const confirmText = prompt('Ketik HAPUS untuk konfirmasi final:');
      if (confirmText !== 'HAPUS') {
        showToast('Reset dibatalkan', 'warning');
        return;
      }
      state.data = [];
      saveData();
      renderApp();
      showToast('Semua data dihapus', 'success');
    }

    function toggleTheme() {
      const isDark = document.documentElement.dataset.theme === 'dark';
      const nextTheme = isDark ? 'light' : 'dark';
      document.documentElement.dataset.theme = nextTheme;
      localStorage.setItem(THEME_KEY, nextTheme);
      document.querySelector('meta[name="theme-color"]')?.setAttribute('content', nextTheme === 'dark' ? '#080b12' : '#eef6ff');
      updateThemeToggleUI();
      if (!state.loading) renderChart();
    }

    async function installPWA() {
      if (!state.deferredInstallPrompt) {
        showToast('Gunakan menu browser lalu pilih Tambahkan ke layar utama', 'info');
        return;
      }
      state.deferredInstallPrompt.prompt();
      await state.deferredInstallPrompt.userChoice;
      state.deferredInstallPrompt = null;
      renderTools();
    }

    function updateThemeToggleUI() {
      const isDark = document.documentElement.dataset.theme === 'dark';
      const label = isDark ? 'Mode Siang' : 'Mode Malam';
      const iconName = isDark ? 'sun' : 'moon';
      document.querySelectorAll('[data-theme-toggle]').forEach((btn) => {
        const isIconOnly = btn.classList.contains('icon-btn');
        const isCompact = btn.hasAttribute('data-theme-compact');
        btn.innerHTML = `${icon(iconName, isCompact ? 20 : 18)}${isIconOnly ? '' : `<span>${isCompact ? 'Tema' : label}</span>`}`;
        btn.setAttribute('aria-label', label);
        btn.setAttribute('title', label);
      });
    }

    function bindEvents() {
      document.addEventListener('click', (event) => {
        const tappable = event.target.closest('button, .metric-card, .package-row');
        if (tappable) {
          tappable.classList.remove('tap-pulse');
          void tappable.offsetWidth;
          tappable.classList.add('tap-pulse');
          setTimeout(() => tappable.classList.remove('tap-pulse'), 380);
        }

        if (event.target.closest('[data-theme-toggle]')) {
          toggleTheme();
          return;
        }

        const nav = event.target.closest('[data-nav]');
        if (nav) {
          navigate(nav.dataset.nav);
          return;
        }

        const open = event.target.closest('[data-open-form]');
        if (open) {
          openForm(open.dataset.openForm || null);
          return;
        }

        if (event.target.closest('[data-close-form]')) {
          closeForm(false);
          return;
        }

        if (event.target.closest('[data-close-import]')) {
          closeImportModal();
          return;
        }

        const metric = event.target.closest('[data-metric]');
        if (metric) {
          state.chartMetric = metric.dataset.metric;
          renderDashboard();
          return;
        }

        const quickTarget = event.target.closest('[data-dream-quick]');
        if (quickTarget) {
          state.dreamTarget = Math.max(0, Number(quickTarget.dataset.dreamQuick) || 0);
          renderDream();
          return;
        }

        if (event.target.closest('[data-save-dream]')) {
          localStorage.setItem(DREAM_KEY, String(state.dreamTarget));
          showToast('Target impian disimpan', 'success');
          return;
        }

        const qtyButton = event.target.closest('[data-qty]');
        if (qtyButton) {
          const id = qtyButton.dataset.pkg;
          const current = parseQty(state.formQty[id]);
          state.formQty[id] = qtyButton.dataset.qty === 'plus' ? current + 1 : Math.max(0, current - 1);
          state.formDirty = true;
          updatePackageInputUI();
          updateFormSummary();
          return;
        }

        const action = event.target.closest('[data-action]');
        if (action) {
          const id = action.dataset.id;
          if (action.dataset.action === 'edit') {
            openForm(id);
            return;
          }
          if (action.dataset.action === 'delete') {
            const ok = confirm('Hapus data bulan ini?');
            if (!ok) return;
            state.data = state.data.filter((row) => row.id !== id);
            saveData();
            renderApp();
            showToast('Data dihapus', 'info');
            return;
          }
        }

        const sortButton = event.target.closest('[data-sort]');
        if (sortButton) {
          const key = sortButton.dataset.sort;
          if (state.historySort.key === key) {
            state.historySort.dir = state.historySort.dir === 'asc' ? 'desc' : 'asc';
          } else {
            state.historySort.key = key;
            state.historySort.dir = 'desc';
          }
          renderHistory();
          return;
        }

        const tool = event.target.closest('[data-tool]');
        if (tool) {
          const type = tool.dataset.tool;
          if (type === 'export') {
            exportJSON();
            showToast('Backup JSON diunduh', 'success');
          }
          if (type === 'import') {
            document.getElementById('importFileInput')?.click();
          }
          if (type === 'reset') {
            resetDataFlow();
          }
          if (type === 'install') {
            installPWA();
          }
          return;
        }

        const importMode = event.target.closest('[data-import-mode]');
        if (importMode) {
          const incoming = state.importPreview || [];
          const count = incoming.length;
          importJSON(incoming, importMode.dataset.importMode);
          state.importPreview = null;
          closeImportModal();
          showToast(`Import berhasil: ${count} data diproses`, 'success');
          return;
        }

        if (event.target.closest('[data-submit-form]')) {
          submitForm();
          return;
        }

        if (event.target.classList.contains('modal')) {
          if (event.target.id === 'formModal') closeForm(false);
          if (event.target.id === 'importModal') closeImportModal();
        }
      });

      document.addEventListener('input', (event) => {
        if (event.target.id === 'dreamTarget') {
          state.dreamTarget = Math.max(0, Number(event.target.value) || 0);
          return;
        }
        const qtyInput = event.target.closest('[data-pkg-input]');
        if (!qtyInput) return;
        const id = qtyInput.dataset.pkgInput;
        state.formQty[id] = parseQty(qtyInput.value);
        state.formDirty = true;
        updatePackageInputUI();
        updateFormSummary();
      });

      document.addEventListener('change', (event) => {
        if (event.target.id === 'dashboardMonthFilter') {
          state.dashboardMonth = event.target.value;
          renderDashboard();
          return;
        }

        if (event.target.id === 'dreamTarget') {
          state.dreamTarget = Math.max(0, Number(event.target.value) || 0);
          renderDream();
          return;
        }

        if (event.target.id === 'formMonth' || event.target.id === 'formYear') {
          state.formDirty = true;
          detectDuplicateMode();
          return;
        }

        const qtyInput = event.target.closest('[data-pkg-input]');
        if (qtyInput) {
          qtyInput.value = String(parseQty(qtyInput.value));
          return;
        }

        if (event.target.id === 'importFileInput') {
          const file = event.target.files?.[0];
          event.target.value = '';
          if (!file) return;
          parseImportFile(file)
            .then((preview) => {
              state.importPreview = preview;
              openImportModal();
            })
            .catch((error) => showToast(error.message || 'File tidak valid', 'error'));
        }
      });

      document.addEventListener('keydown', (event) => {
        if (event.key !== 'Escape') return;
        closeForm(false);
        closeImportModal();
      });
    }

    function bindSystemAlerts() {
      window.addEventListener('beforeinstallprompt', (event) => {
        event.preventDefault();
        state.deferredInstallPrompt = event;
        if (state.currentView === 'tools') renderTools();
      });

      window.addEventListener('appinstalled', () => {
        state.deferredInstallPrompt = null;
        showToast('BBI Flow berhasil dipasang', 'success');
      });

      window.addEventListener('beforeunload', (event) => {
        if (!state.formDirty) return;
        event.preventDefault();
        event.returnValue = '';
      });

      window.addEventListener('popstate', (event) => {
        const formModal = document.getElementById('formModal');
        if (formModal.classList.contains('show')) {
          if (state.formDirty && !confirm('Ada perubahan belum disimpan. Tetap kembali?')) {
            history.pushState({ view: state.currentView }, '', `#${state.currentView}`);
            return;
          }
          closeForm(true);
          showToast('Form ditutup', 'info');
        }

        const view = event.state?.view || getViewFromHash();
        navigate(view, true, false);
      });

      window.addEventListener('error', () => {
        showToast('Terjadi error aplikasi', 'error');
      });

      window.addEventListener('unhandledrejection', () => {
        showToast('Proses gagal dijalankan', 'error');
      });
    }

    (function init() {
      const savedTheme = localStorage.getItem(THEME_KEY) || 'light';
      document.documentElement.dataset.theme = savedTheme;
      document.querySelector('meta[name="theme-color"]')?.setAttribute('content', savedTheme === 'dark' ? '#080b12' : '#eef6ff');
      state.dreamTarget = Math.max(0, Number(localStorage.getItem(DREAM_KEY)) || 1000000);
      state.currentView = getViewFromHash();
      history.replaceState({ view: state.currentView }, '', `#${state.currentView}`);
      state.data = loadData();
      bindEvents();
      bindSystemAlerts();
      renderApp();
      updateThemeToggleUI();
      setTimeout(() => {
        state.loading = false;
        renderDashboard();
      }, 240);
      if ('serviceWorker' in navigator && location.protocol !== 'file:') {
        window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
      }
    })();
  </script>
</body>
</html>
